<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>商品搜索</title>

<style>

body{
    margin:0;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    background:#f5f5f5;
}

.header{
    background:#222;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
}

.search-box{
    width:600px;
    margin:40px auto;
    display:flex;
}

.search-box input{
    flex:1;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px 0 0 5px;
}

.search-box button{
    width:100px;
    border:none;
    background:#ff4d4f;
    color:white;
    font-size:16px;
    border-radius:0 5px 5px 0;
    cursor:pointer;
}

.search-box button:hover{
    background:#ff7875;
}

.result{
    width:1000px;
    margin:0 auto;
}

.result-title{
    font-size:20px;
    margin-bottom:20px;
}

.product-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product{
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    cursor:pointer;
}

.product-icon{
    height:150px;
    background:#f8f8f8;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    margin-bottom:15px;
}

.product-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.product-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-brief{
    color:#666;
    font-size:14px;
    height:40px;
    overflow:hidden;
    margin-bottom:10px;
}

.price{
    color:#e64340;
    font-size:20px;
    font-weight:bold;
}

.stock{
    color:#999;
    margin-top:5px;
}

.back{
    text-align:center;
    margin:40px;
}

.back a{
    color:#1677ff;
    text-decoration:none;
}

/* 新增：加载和错误提示样式 */
.status-msg{
    text-align:center;
    padding:40px;
    color:#666;
    font-size:16px;
}

.status-msg.error{
    color:#ff4d4f;
}

</style>

</head>

<body>

<div class="header">
    商品搜索
</div>

<div class="search-box">

    <input
        type="text"
        id="keyword"
        placeholder="请输入商品名称"
        onkeydown="if(event.key==='Enter')searchProduct()">

    <button onclick="searchProduct()">
        搜索
    </button>

</div>


<div class="result">

    <div class="result-title" id="resultTitle">
        搜索结果
    </div>

    <div
        class="product-list"
        id="productList">
    </div>

    <div class="status-msg" id="statusMsg" style="display:none;"></div>

</div>


<div class="back">

    <a href="/">
        返回首页
    </a>

</div>


<script>

function searchProduct()
{
    const keyword = document.getElementById("keyword").value.trim();
    const list = document.getElementById("productList");
    const title = document.getElementById("resultTitle");
    const status = document.getElementById("statusMsg");

    if(keyword === "")
    {
        alert("请输入商品名称");
        return;
    }

    /* 显示加载中 */
    list.innerHTML = "";
    status.style.display = "block";
    status.className = "status-msg";
    status.textContent = "正在搜索...";
    title.innerHTML = "搜索结果";

    fetch("/search",
    {
        method:"POST",
        headers:
        {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "keyword=" + encodeURIComponent(keyword)
    })
    .then(response => response.text())
    .then(text =>
    {
        try
        {
            var data = JSON.parse(text);
            showProducts(data, keyword);
        }
        catch(e)
        {
            console.error("服务器返回了非JSON数据:", text.substring(0, 200));
            status.style.display = "block";
            status.className = "status-msg error";
            status.textContent = "搜索失败：服务器返回了意外的数据格式，请检查后端是否正常。";
            title.innerHTML = "搜索失败";
        }
    })
    .catch(error =>
    {
        console.log(error);
        status.style.display = "block";
        status.className = "status-msg error";
        status.textContent = "搜索请求失败: " + error.message;
        title.innerHTML = "搜索失败";
    });
}


function showProducts(data,keyword)
{
    const list = document.getElementById("productList");
    const title = document.getElementById("resultTitle");
    const status = document.getElementById("statusMsg");

    status.style.display = "none";
    list.innerHTML = "";

    title.innerHTML = "搜索结果：" + keyword + "（" + data.length + "件）";

    if(data.length === 0)
    {
        status.style.display = "block";
        status.className = "status-msg";
        status.textContent = "没有找到相关商品";
        return;
    }

    data.forEach(function(product)
    {
        const div = document.createElement("div");
        div.className = "product";
        div.onclick = function()
        {
            window.location.href = "/goods?id=" + product.id;
        };

        div.innerHTML =
            '<div class="product-icon">' +
            '<img src="/' + product.image + '" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'📦\';">' +
            '</div>' +

            '<div class="product-name">' +
            product.name +
            '</div>' +

            '<div class="product-brief">' +
            product.brief +
            '</div>' +

            '<div class="price">¥' +
            product.price +
            '</div>' +

            '<div class="stock">库存：' +
            product.stock +
            '</div>';

        list.appendChild(div);
    });
}

</script>

</body>
</html>
