<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易购商城 - 注册</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Microsoft YaHei",Arial,sans-serif;
    background:linear-gradient(135deg,#fff0f3,#f8f9ff);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#333;
}

.register-box{
    width:420px;
    max-width:92%;
    background:#fff;
    padding:42px 40px 36px;
    border-radius:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.09);
}

.logo{
    text-align:center;
    color:#ff4d6d;
    font-size:26px;
    font-weight:bold;
    margin-bottom:10px;
}

.title{
    text-align:center;
    font-size:23px;
    color:#222;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#999;
    font-size:13px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:14px;
    margin-bottom:8px;
    color:#555;
}

.input-box{
    width:100%;
    height:46px;
    border:1px solid #ddd;
    border-radius:8px;
    display:flex;
    align-items:center;
    padding:0 14px;
    transition:.2s;
}

.input-box:focus-within{
    border-color:#ff4d6d;
    box-shadow:0 0 0 3px rgba(255,77,109,.08);
}

.input-icon{
    margin-right:9px;
    font-size:17px;
}

.input-box input{
    width:100%;
    border:0;
    outline:0;
    font-size:14px;
    background:transparent;
}

.agreement{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:#999;
    margin:4px 0 22px;
}

.agreement input{
    accent-color:#ff4d6d;
}

.agreement a{
    color:#ff4d6d;
    text-decoration:none;
}

.register-btn{
    width:100%;
    height:46px;
    border:0;
    border-radius:23px;
    background:#ff4d6d;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.register-btn:hover{
    background:#e83e5d;
    box-shadow:0 6px 16px rgba(255,77,109,.22);
}

.bottom{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#999;
}

.bottom a{
    color:#ff4d6d;
    text-decoration:none;
    margin-left:5px;
}

.bottom a:hover{
    text-decoration:underline;
}

.message{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:7px;
    text-align:center;
    font-size:13px;
    background:#fff0f3;
    color:#ff4d6d;
}

@media(max-width:500px){

    .register-box{
        padding:35px 25px 30px;
    }

}

</style>

</head>

<body>

<div class="register-box">

    <div class="logo">
        ♥ 易购商城
    </div>

    <div class="title">
        创建账号
    </div>

    <div class="subtitle">
        注册账号，开启轻松购物体验
    </div>


    <!-- 注册表单 -->

    <form action="/register"
          method="post"
          onsubmit="return registerUser()">


        <!-- 用户名 -->

        <div class="form-group">

            <label>
                用户名
            </label>

            <div class="input-box">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="请输入用户名"
                    maxlength="30"
                    required
                >

            </div>

        </div>


        <!-- 密码 -->

        <div class="form-group">

            <label>
                密码
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="请输入密码"
                    maxlength="30"
                    required
                >

            </div>

        </div>


        <!-- 用户协议 -->

        <div class="agreement">

            <input
                type="checkbox"
                id="agree"
                required
            >

            <span>
                我已阅读并同意
            </span>

            <a href="#"
               onclick="return false;">
                用户协议
            </a>

        </div>


        <!-- 注册按钮 -->

        <button
            class="register-btn"
            type="submit">

            立即注册

        </button>


        <!-- 提示信息 -->

        <div
            class="message"
            id="message">
        </div>

    </form>


    <!-- 返回登录 -->

    <div class="bottom">

        已有账号？

        <a href="/">
            立即登录
        </a>

    </div>

</div>


<script>

/* ==================== 注册检查 ==================== */

function registerUser()
{
    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if(username === "")
    {
        showMessage("请输入用户名");

        return false;
    }


    if(password === "")
    {
        showMessage("请输入密码");

        return false;
    }


    return true;
}


/* ==================== 显示提示 ==================== */

function showMessage(text)
{
    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";
}

</script>

</body>

</html>
